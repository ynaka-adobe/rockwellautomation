<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img">
  <title>Change offer</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Back card -->
  <rect x="20" y="20" width="160" height="200" rx="10" fill="#e8eaed" stroke="#c0c4cc" stroke-width="1.5"/>
  <rect x="34" y="38" width="90" height="9" rx="3" fill="#b0b4be"/>
  <rect x="34" y="55" width="118" height="7" rx="3" fill="#c8ccd4"/>
  <rect x="34" y="70" width="100" height="7" rx="3" fill="#c8ccd4"/>
  <rect x="34" y="93" width="132" height="72" rx="6" fill="#c2d4e8"/>
  <rect x="34" y="178" width="72" height="22" rx="6" fill="#c0c4cc"/>

  <!-- Front card -->
  <rect x="100" y="50" width="160" height="200" rx="10" fill="#ffffff" stroke="#8a8fa8" stroke-width="1.5"/>
  <rect x="114" y="68" width="90" height="9" rx="3" fill="#4a4e5a"/>
  <rect x="114" y="85" width="118" height="7" rx="3" fill="#c0c4cc"/>
  <rect x="114" y="100" width="100" height="7" rx="3" fill="#c0c4cc"/>
  <rect x="114" y="123" width="132" height="72" rx="6" fill="#b8e0c8"/>
  <rect x="114" y="208" width="72" height="22" rx="6" fill="#4a8fc4"/>

  <!-- Swap circle -->
  <circle cx="148" cy="158" r="26" fill="#ffffff" stroke="#8a8fa8" stroke-width="1.5"/>
  <path d="M133 151 A18 18 0 0 1 163 151" fill="none" stroke="#4a8fc4" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M163 165 A18 18 0 0 1 133 165" fill="none" stroke="#3aaa6a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>
</svg>
